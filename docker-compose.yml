services:
  postgres:
    image: postgres:16
    container_name: expense-tracker-postgres
    restart: always

    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: expense_pass

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: expense-tracker-redis
    restart: always

    ports:
      - "6379:6379"

volumes:
  postgres_data: